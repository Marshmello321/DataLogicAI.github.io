<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLogic AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --bar-bg: #1e1f20;
            --user-bubble: #282a2c;
            --accent: #a8c7fa;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
            --border-color: #444746;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* --- SIDEBAR & HISTORY MENU --- */
        .sidebar {
            width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 16px; box-sizing: border-box;
            transition: transform 0.3s ease; flex-shrink: 0; z-index: 100;
        }
        .sidebar.hidden { transform: translateX(-100%); position: absolute; height: 100%; }

        .new-chat-btn {
            background-color: transparent; color: var(--text-main); border: 1px solid var(--border-color);
            padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 8px;
            cursor: pointer; font-size: 14px; transition: background 0.2s; margin-bottom: 24px;
        }
        .new-chat-btn:hover { background-color: rgba(255,255,255,0.05); }
        
        .history-list { flex-grow: 1; overflow-y: auto; }
        .history-section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin: 12px 0 8px 4px; letter-spacing: 0.5px; }
        .history-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-muted);
            font-size: 13px; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center;
            position: relative;
        }
        .history-item.active { background-color: rgba(255,255,255,0.1); color: var(--text-main); }
        .history-item:hover { background-color: rgba(255,255,255,0.05); color: var(--text-main); }
        .history-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; margin-right: 8px; }
        
        .history-options-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; opacity: 0; }
        .history-item:hover .history-options-btn { opacity: 1; }
        .history-options-btn:hover { background-color: rgba(255,255,255,0.1); color: var(--text-main); }

        .history-dropdown {
            display: none; position: absolute; right: 10px; top: 30px; background-color: #282a2c;
            min-width: 140px; box-shadow: 0px 8px 16px rgba(0,0,0,0.5); z-index: 1000;
            border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden;
        }
        .history-dropdown.show { display: block; }
        .history-dropdown button {
            color: var(--text-main); padding: 10px 14px; display: flex; align-items: center; gap: 8px;
            background: none; border: none; width: 100%; text-align: left; cursor: pointer; font-size: 13px;
        }
        .history-dropdown button:hover { background-color: rgba(255,255,255,0.1); }

        /* --- MAIN CONTENT & EMPTY STATE --- */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
        .menu-toggle { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; }

        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-grow: 1; padding: 20px; text-align: center; margin-bottom: 80px;
        }
        .empty-state h1 { font-size: 32px; margin-bottom: 32px; background: linear-gradient(90deg, #a8c7fa, #c58af9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .suggestions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 600px; }
        .suggestion-chip {
            background-color: var(--sidebar-bg); border: 1px solid var(--border-color);
            padding: 12px 20px; border-radius: 12px; cursor: pointer; color: var(--text-muted);
            transition: 0.2s; font-size: 14px; flex: 1 1 calc(50% - 12px); min-width: 200px; text-align: left;
        }
        .suggestion-chip:hover { background-color: rgba(255,255,255,0.05); color: var(--text-main); border-color: var(--accent); }

        /* --- CHAT STREAM --- */
        .chat-container {
            display: none; flex-grow: 1; overflow-y: auto; padding: 20px 20px 140px 20px;
            flex-direction: column; align-items: center; scroll-behavior: smooth;
        }
        .message-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; margin-bottom: 32px; }
        .user-message { align-items: flex-end; }
        .ai-message { align-items: flex-start; }

        .bubble { padding: 16px 20px; border-radius: 20px; max-width: 90%; line-height: 1.6; }
        .user-bubble { background-color: var(--user-bubble); border-bottom-right-radius: 4px; color: var(--text-main); }
        .ai-bubble { background-color: transparent; color: var(--text-main); width: 100%; }

        .chat-images { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; justify-content: flex-end; }
        .chat-img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }

        /* --- ICONS & ACTIONS --- */
        .message-actions { display: flex; gap: 16px; margin-top: 8px; color: var(--text-muted); font-size: 13px; font-weight: 500; }
        .action-link { cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .action-link:hover { color: var(--text-main); }
        .action-link svg { width: 14px; height: 14px; }
        .copied { color: #4ade80 !important; }

        .spinner { width: 16px; height: 16px; border: 2px solid transparent; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px;}
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- INPUT BAR --- */
        .input-wrapper {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 800px; background-color: var(--bar-bg);
            border-radius: 24px; padding: 12px 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; z-index: 50;
        }
        .file-previews { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
        .file-previews:empty { display: none; margin-bottom: 0; }
        .preview-card { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .preview-card img { width: 100%; height: 100%; object-fit: cover; }
        .remove-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .remove-btn:hover { background: #ff4444; }

        .chat-bar { display: flex; align-items: flex-end; gap: 12px; }
        textarea { flex-grow: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; resize: none; outline: none; max-height: 150px; min-height: 24px; padding: 10px 0; font-family: inherit; }
        
        .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; transition: 0.2s; }
        .icon-btn:hover { background-color: rgba(255,255,255,0.1); }
        .send-btn { background-color: #0b57d0; color: #ffffff; margin-bottom: 2px; }
        .send-btn:hover { background-color: #1b6ef3; }

        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th, td { border: 1px solid var(--border-color); padding: 10px 14px; text-align: left; }
        th { background-color: #282a2c; color: var(--accent); }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        New Chat
    </button>
    <div class="history-list" id="history-list">
        <!-- Dynamic History Injected Here -->
    </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
    <header class="header">
        <button class="menu-toggle" id="toggle-sidebar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <h2 style="margin:0; font-size: 18px; color: var(--text-muted);">DataLogic AI</h2>
        <div style="width:40px;"></div> <!-- Spacer for flex alignment -->
    </header>

    <!-- EMPTY STATE DASHBOARD -->
    <div class="empty-state" id="empty-state">
        <h1>What would you like to analyze today?</h1>
        <div class="suggestions">
            <div class="suggestion-chip" onclick="setPrompt('Analyze these two YouTube thumbnails and tell me which one will have a higher CTR.')">
                <strong style="color:var(--text-main);">🖼️ Compare Thumbnails</strong><br>Find out which image drives more clicks.
            </div>
            <div class="suggestion-chip" onclick="setPrompt('Extract all the text, numbers, and key data from this document into a table.')">
                <strong style="color:var(--text-main);">📄 Extract Data</strong><br>Pull clean tables from screenshots or invoices.
            </div>
            <div class="suggestion-chip" onclick="setPrompt('Act as an expert. Give me 3 creative ways to improve this image.')">
                <strong style="color:var(--text-main);">🎨 Creative Critique</strong><br>Get actionable feedback on your designs.
            </div>
        </div>
    </div>

    <!-- CHAT STREAM -->
    <div class="chat-container" id="chat-container"></div>

    <!-- INPUT BAR -->
    <div class="input-wrapper">
        <div id="file-previews" class="file-previews"></div>
        <div class="chat-bar">
            <input type="file" id="file-upload" accept=".csv, .xlsx, image/png, image/jpeg" multiple style="display: none;">
            <button id="add-file-btn" class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg></button>
            <textarea id="prompt-input" rows="1" placeholder="Ask a question or upload files..."></textarea>
            <button id="send-btn" class="icon-btn send-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
        </div>
    </div>
</main>

<script>
    // --- ICONS ---
    const editIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
    const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
    const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

    // --- STATE & HISTORY MANAGEMENT ---
    let sessions = JSON.parse(localStorage.getItem('dl_sessions')) || [];
    let currentSessionId = null;

    function saveSession(userText, base64Images, aiHtml) {
        try {
            if (!currentSessionId) {
                currentSessionId = Date.now().toString();
                const title = userText ? userText.split(' ').slice(0, 4).join(' ') + '...' : 'New Analysis';
                sessions.unshift({ id: currentSessionId, title: title, pinned: false, messages: [] });
            }
            
            const session = sessions.find(s => s.id === currentSessionId);
            if (session) {
                session.messages.push({ role: 'user', text: userText, images: base64Images });
                session.messages.push({ role: 'ai', text: aiHtml });
                localStorage.setItem('dl_sessions', JSON.stringify(sessions));
                renderSidebar();
            }
        } catch (e) {
            console.warn("Local storage full! Clearing old chats.");
            if(sessions.length > 3) sessions.pop(); // delete oldest to make room for images
            localStorage.setItem('dl_sessions', JSON.stringify(sessions));
        }
    }

    function renderSidebar() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        
        let pinned = sessions.filter(s => s.pinned);
        let unpinned = sessions.filter(s => !s.pinned);

        if (pinned.length > 0) {
            list.innerHTML += `<div class="history-section-title">Pinned</div>`;
            pinned.forEach(s => list.appendChild(createHistoryItem(s)));
            list.innerHTML += `<div class="history-section-title" style="margin-top:20px;">Recent</div>`;
        }
        unpinned.forEach(s => list.appendChild(createHistoryItem(s)));
    }

    function createHistoryItem(session) {
        const item = document.createElement('div');
        item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
        item.innerHTML = `
            <span class="history-title">${session.title}</span>
            <button class="history-options-btn" onclick="toggleMenu('${session.id}', event)">⋮</button>
            <div class="history-dropdown" id="menu-${session.id}">
                <button onclick="actionChat('${session.id}', 'pin', event)">📌 ${session.pinned ? 'Unpin' : 'Pin Chat'}</button>
                <button onclick="actionChat('${session.id}', 'rename', event)">✏️ Rename</button>
                <button onclick="alert('Share URL generated!')">🔗 Share</button>
                <button onclick="actionChat('${session.id}', 'delete', event)" style="color:#ff4444;">🗑️ Delete</button>
            </div>
        `;
        item.addEventListener('click', () => loadSession(session.id));
        return item;
    }

    window.toggleMenu = function(id, event) {
        event.stopPropagation();
        document.querySelectorAll('.history-dropdown').forEach(d => d.classList.remove('show'));
        document.getElementById(`menu-${id}`).classList.add('show');
    }

    window.actionChat = function(id, action, event) {
        event.stopPropagation();
        const session = sessions.find(s => s.id === id);
        if (action === 'delete') {
            sessions = sessions.filter(s => s.id !== id);
            if (currentSessionId === id) startNewChat();
        } else if (action === 'pin') {
            session.pinned = !session.pinned;
        } else if (action === 'rename') {
            const newName = prompt("Rename chat:", session.title);
            if (newName) session.title = newName;
        }
        localStorage.setItem('dl_sessions', JSON.stringify(sessions));
        renderSidebar();
    }

    window.onclick = function() { document.querySelectorAll('.history-dropdown').forEach(d => d.classList.remove('show')); }

    function startNewChat() {
        currentSessionId = null;
        document.getElementById('chat-container').innerHTML = '';
        document.getElementById('chat-container').style.display = 'none';
        document.getElementById('empty-state').style.display = 'flex';
        allUploadedFiles = []; updateDisplay();
        renderSidebar();
    }

    function loadSession(id) {
        currentSessionId = id;
        const session = sessions.find(s => s.id === id);
        document.getElementById('empty-state').style.display = 'none';
        const chatBox = document.getElementById('chat-container');
        chatBox.style.display = 'flex';
        chatBox.innerHTML = '';
        
        if (session) {
            session.messages.forEach(msg => {
                if (msg.role === 'user') appendUserMessage(msg.text, msg.images || []);
                if (msg.role === 'ai') appendAIMessage(msg.text, false);
            });
        }
        renderSidebar();
        if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('hidden');
    }

    // --- UI SETUP ---
    document.getElementById('toggle-sidebar').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('hidden'); });
    renderSidebar();

    // --- SUGGESTION CHIPS ---
    window.setPrompt = function(text) {
        document.getElementById('prompt-input').value = text;
        document.getElementById('prompt-input').focus();
    }

    // --- FILE UPLOADS (Base64) ---
    const fileInput = document.getElementById('file-upload');
    const filePreviews = document.getElementById('file-previews');
    const promptInput = document.getElementById('prompt-input');
    
    let allUploadedFiles = []; // holds { dataUrl, mimeType }

    promptInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });
    document.getElementById('add-file-btn').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
        for (let i = 0; i < e.target.files.length; i++) {
            const fileData = await compressImage(e.target.files[i]);
            allUploadedFiles.push(fileData);
        }
        updateDisplay();
    });

    async function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > 800 || h > 800) { if (w > h) { h = Math.round(h * 800 / w); w = 800; } else { w = Math.round(w * 800 / h); h = 800; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function updateDisplay() {
        filePreviews.innerHTML = '';
        allUploadedFiles.forEach((file, index) => {
            const card = document.createElement('div'); card.className = 'preview-card';
            card.innerHTML = `<img src="${file.dataUrl}"><button class="remove-btn" onclick="removeFile(${index})">✕</button>`;
            filePreviews.appendChild(card);
        });
    }

    window.removeFile = function(index) { allUploadedFiles.splice(index, 1); updateDisplay(); }

    // --- CHAT RENDERING ---
    function appendUserMessage(text, imgUrls) {
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('chat-container').style.display = 'flex';
        
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper user-message';
        let imagesHtml = imgUrls.length > 0 ? `<div class="chat-images">` + imgUrls.map(url => `<img src="${url}" class="chat-img">`).join('') + `</div>` : '';
        const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        wrapper.innerHTML = `
            ${imagesHtml}
            <div class="bubble user-bubble">${safeText}</div>
            <div class="message-actions">
                <span class="action-link" onclick="editPrompt(this)" data-raw="${encodeURIComponent(text)}">${editIcon} Edit</span>
                <span class="action-link" onclick="copyPrompt(this)" data-raw="${encodeURIComponent(text)}">${copyIcon} Copy</span>
            </div>
        `;
        document.getElementById('chat-container').appendChild(wrapper);
        scrollToBottom();
    }

    window.editPrompt = function(el) { promptInput.value = decodeURIComponent(el.getAttribute('data-raw')); promptInput.focus(); }
    
    window.copyPrompt = function(el) { 
        navigator.clipboard.writeText(decodeURIComponent(el.getAttribute('data-raw')));
        const originalHtml = el.innerHTML;
        el.innerHTML = `${checkIcon} Copied!`; el.classList.add('copied');
        setTimeout(() => { el.innerHTML = originalHtml; el.classList.remove('copied'); }, 2000);
    }

    function appendAIMessage(htmlContent, isLoading = false) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper ai-message';
        wrapper.innerHTML = `<div class="bubble ai-bubble">${htmlContent}</div>`;
        document.getElementById('chat-container').appendChild(wrapper);
        scrollToBottom();
        return wrapper.querySelector('.ai-bubble');
    }

    function scrollToBottom() {
        const chat = document.getElementById('chat-container');
        chat.scrollTop = chat.scrollHeight;
    }

    // --- STREAMING ANIMATION ---
    function streamText(bubbleElement, rawMarkdown, onComplete) {
        let currentLength = 0;
        const chunkSize = 5; // Characters per frame
        
        const interval = setInterval(() => {
            currentLength += chunkSize;
            if (currentLength >= rawMarkdown.length) {
                currentLength = rawMarkdown.length;
                clearInterval(interval);
                bubbleElement.innerHTML = marked.parse(rawMarkdown); // final clean parse
                if(onComplete) onComplete();
            } else {
                bubbleElement.innerHTML = marked.parse(rawMarkdown.substring(0, currentLength) + '▌');
            }
            scrollToBottom();
        }, 15); // Milliseconds per frame
    }

    // --- SEND API REQUEST ---
    document.getElementById('send-btn').addEventListener('click', async () => {
        let userText = promptInput.value.trim();
        if (!userText && allUploadedFiles.length === 0) return;
        if (!userText) userText = "Analyze these files and provide a detailed breakdown.";

        const imagesToSave = allUploadedFiles.map(f => f.dataUrl);
        const imagesToSend = allUploadedFiles.map(f => ({ inlineData: { data: f.base64, mimeType: f.mimeType } }));
        
        appendUserMessage(userText, imagesToSave);
        
        allUploadedFiles = []; updateDisplay(); 
        promptInput.value = ''; promptInput.style.height = 'auto';

        const loadingBubble = appendAIMessage(`<div class="spinner"></div> <span>Analyzing data...</span>`, true);

        try {
            let contents = [{ parts: [{ text: userText }] }];
            if (imagesToSend.length > 0) contents[0].parts.push(...imagesToSend);

            const response = await fetch("/api/analyze", {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents })
            });

            const data = await response.json();
            
            if (!response.ok) {
                loadingBubble.innerHTML = `API Error: ${data.error || 'Request failed'}`;
                loadingBubble.style.color = '#ff4444';
            } else {
                const rawMarkdown = data.candidates[0].content.parts[0].text;
                // Run the streaming animation!
                streamText(loadingBubble, rawMarkdown, () => {
                    saveSession(userText, imagesToSave, marked.parse(rawMarkdown)); 
                });
            }
        } catch (error) {
            loadingBubble.innerHTML = `Something went wrong. Check console.`;
            loadingBubble.style.color = '#ff4444';
        }
    });

    promptInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('send-btn').click(); }
    });
</script>
</body>
</html>
