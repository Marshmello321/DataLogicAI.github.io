<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLogic AI - Multi-File Intelligence</title>
    <!-- Marked library for parsing Markdown tables and headings -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        #drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: rgba(15, 23, 42, 0.5);
        }

        #drop-zone.dragover {
            border-color: var(--accent);
            background-color: rgba(56, 189, 248, 0.1);
        }

        .file-input-wrapper {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-btn {
            background-color: #334155;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .custom-file-btn:hover {
            background-color: #475569;
        }

        #file-list {
            list-style: none;
            padding: 0;
            margin: 16px 0 0 0;
        }

        #file-list li {
            background: rgba(15, 23, 42, 0.6);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--accent);
            border: 1px solid #334155;
        }

        .analyze-btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 16px;
        }

        .analyze-btn:hover {
            background-color: var(--accent-hover);
        }

        #loading {
            display: none;
            text-align: center;
            color: var(--accent);
            font-weight: 600;
            padding: 16px;
        }

        #result-box {
            display: none;
            line-height: 1.6;
        }

        /* Markdown Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            text-align: left;
        }

        th {
            background-color: #0f172a;
            color: var(--accent);
        }

        td {
            background-color: rgba(15, 23, 42, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>DataLogic AI</h1>
    <p class="subtitle">Multi-file visual intelligence & data analysis engine.</p>

    <div class="card">
        <div id="drop-zone">
            <strong>Drag and drop files here</strong>
            <p style="color: var(--text-muted); font-size: 13px; margin: 6px 0 0 0;">Accepts images (.png, .jpg) & datasets</p>
        </div>

        <div class="file-input-wrapper">
            <label for="file-upload" class="custom-file-btn">Browse Files</label>
            <span id="file-count" style="color: var(--text-muted); font-size: 14px;">No files selected</span>
            <input type="file" id="file-upload" accept=".csv, .xlsx, image/png, image/jpeg" multiple>
        </div>

        <ul id="file-list"></ul>

        <button id="analyze-btn" class="analyze-btn">Analyze with AI</button>
    </div>

    <div id="loading">⚡ Analyzing files with Gemini... Please wait...</div>

    <div id="result-container" class="card" style="display: none;">
        <h3 style="margin-top: 0; color: var(--accent);">Analysis Report</h3>
        <div id="result-box"></div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-upload');
    const fileListDisplay = document.getElementById('file-list');
    const fileCount = document.getElementById('file-count');
    const analyzeBtn = document.getElementById('analyze-btn');
    const loading = document.getElementById('loading');
    const resultContainer = document.getElementById('result-container');
    const resultBox = document.getElementById('result-box');
    
    let allUploadedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => processFiles(e.target.files));
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) processFiles(e.dataTransfer.files);
    });

    function processFiles(files) {
        for (let i = 0; i < files.length; i++) allUploadedFiles.push(files[i]);
        updateDisplay();
    }

    function updateDisplay() {
        fileListDisplay.innerHTML = '';
        fileCount.textContent = allUploadedFiles.length === 1 ? '1 file selected' : `${allUploadedFiles.length} files selected`;
        allUploadedFiles.forEach(file => {
            const li = document.createElement('li');
            li.textContent = '📄 ' + file.name;
            fileListDisplay.appendChild(li);
        });
    }

    async function fileToGenerativePart(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const maxDim = 1024;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const base64Data = compressedDataUrl.split(',')[1];

                    resolve({
                        inlineData: { data: base64Data, mimeType: 'image/jpeg' }
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    analyzeBtn.addEventListener('click', async () => {
        if (allUploadedFiles.length === 0) {
            alert("Please upload at least one file first!");
            return;
        }

        loading.style.display = "block";
        resultContainer.style.display = "none";

        try {
            const imageParts = await Promise.all(allUploadedFiles.map(fileToGenerativePart));
            const prompt = "Act as an expert data and media analyst. Provide a structured markdown table and concise actionable feedback analyzing the provided files.";

            const response = await fetch("/api/analyze", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: prompt }, ...imageParts]
                    }]
                })
            });

            const data = await response.json();
            
            if (!response.ok) {
                resultBox.innerHTML = `<p style="color: #ef4444;">API Error: ${data.error || 'Request failed'}</p>`;
            } else {
                const rawMarkdown = data.candidates[0].content.parts[0].text;
                resultBox.innerHTML = marked.parse(rawMarkdown);
            }

            resultContainer.style.display = "block";
            resultBox.style.display = "block";

        } catch (error) {
            console.error("Crash Error:", error);
            resultBox.innerHTML = `<p style="color: #ef4444;">Something went wrong. Please try again.</p>`;
            resultContainer.style.display = "block";
            resultBox.style.display = "block";
        } finally {
            loading.style.display = "none";
        }
    });
</script>
</body>
</html>
