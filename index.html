<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLogic AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #131314;
            --bar-bg: #1e1f20;
            --accent: #a8c7fa;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
            --border-color: #444746;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px 120px 20px; /* Extra bottom padding for the fixed bar */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #a8c7fa, #c58af9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 40px;
        }

        /* The Gemini-Style Input Area */
        .input-wrapper {
            position: fixed;
            bottom: 30px;
            width: 100%;
            max-width: 800px;
            background-color: var(--bar-bg);
            border-radius: 24px;
            padding: 12px 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .file-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .file-chips:empty {
            display: none;
            margin-bottom: 0;
        }

        .chip {
            background-color: #333537;
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-bar {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .send-btn {
            background-color: #0b57d0;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .send-btn:hover {
            background-color: #1b6ef3;
        }

        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            resize: none;
            outline: none;
            max-height: 150px;
            min-height: 24px;
            padding: 10px 0;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #8e918f;
        }

        /* Result Area */
        .card {
            background-color: transparent;
            border: none;
            line-height: 1.6;
        }

        #loading {
            display: none;
            text-align: center;
            color: var(--accent);
            font-weight: 600;
            margin-top: 20px;
        }

        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th, td { border: 1px solid var(--border-color); padding: 10px 14px; text-align: left; }
        th { background-color: #1e1f20; color: var(--accent); }
        td { background-color: rgba(30, 31, 32, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <h1>DataLogic AI</h1>
    <p class="subtitle">Ask questions or analyze files.</p>

    <div id="loading">✨ Analyzing... Please wait...</div>

    <div id="result-container" class="card" style="display: none;">
        <div id="result-box"></div>
    </div>
</div>

<!-- Gemini Style Input Bar -->
<div class="input-wrapper">
    <div id="file-chips" class="file-chips"></div>
    <div class="chat-bar">
        <input type="file" id="file-upload" accept=".csv, .xlsx, image/png, image/jpeg" multiple style="display: none;">
        
        <button id="add-file-btn" class="icon-btn" title="Upload Image or File">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14m-7-7h14"/></svg>
        </button>

        <textarea id="prompt-input" rows="1" placeholder="Ask a question or describe how to analyze the files..."></textarea>

        <button id="send-btn" class="icon-btn send-btn" title="Send Message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-upload');
    const addFileBtn = document.getElementById('add-file-btn');
    const fileChips = document.getElementById('file-chips');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    
    const loading = document.getElementById('loading');
    const resultContainer = document.getElementById('result-container');
    const resultBox = document.getElementById('result-box');
    
    let allUploadedFiles = [];

    // Auto-resize text area like a chat app
    promptInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    // Handle File Selection
    addFileBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => processFiles(e.target.files));

    function processFiles(files) {
        for (let i = 0; i < files.length; i++) allUploadedFiles.push(files[i]);
        updateDisplay();
    }

    function updateDisplay() {
        fileChips.innerHTML = '';
        allUploadedFiles.forEach(file => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.textContent = '🖼️ ' + file.name;
            fileChips.appendChild(chip);
        });
    }

    // Compress Images (Kept exactly as you had it working)
    async function fileToGenerativePart(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const maxDim = 1024;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; } 
                        else { width = Math.round((width * maxDim) / height); height = maxDim; }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const base64Data = compressedDataUrl.split(',')[1];
                    resolve({ inlineData: { data: base64Data, mimeType: 'image/jpeg' } });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // Send to Backend
    sendBtn.addEventListener('click', async () => {
        let userText = promptInput.value.trim();
        
        // If they just hit send without typing, use our default expert prompt
        if (!userText) {
            userText = "Act as an expert data and media analyst. Provide a structured markdown table and concise actionable feedback analyzing the provided files.";
        }

        loading.style.display = "block";
        resultContainer.style.display = "none";
        promptInput.value = ''; // clear input box
        promptInput.style.height = 'auto'; // reset height

        try {
            const imageParts = await Promise.all(allUploadedFiles.map(fileToGenerativePart));
            
            // Build the message exactly how Google likes it
            let contents = [{ parts: [{ text: userText }] }];
            if (imageParts.length > 0) {
                contents[0].parts.push(...imageParts);
            }

            const response = await fetch("/api/analyze", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents })
            });

            const data = await response.json();
            
            if (!response.ok) {
                resultBox.innerHTML = `<p style="color: #ef4444;">API Error: ${data.error || 'Request failed'}</p>`;
            } else {
                const rawMarkdown = data.candidates[0].content.parts[0].text;
                resultBox.innerHTML = marked.parse(rawMarkdown);
                allUploadedFiles = []; // clear files after successful send
                updateDisplay();
            }

            resultContainer.style.display = "block";
            window.scrollTo(0, 0); // scroll up to see results

        } catch (error) {
            console.error("Crash Error:", error);
            resultBox.innerHTML = `<p style="color: #ef4444;">Something went wrong. Check console.</p>`;
            resultContainer.style.display = "block";
        } finally {
            loading.style.display = "none";
        }
    });

    // Allow pressing "Enter" to send
    promptInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendBtn.click();
        }
    });
</script>
</body>
</html>
