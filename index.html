<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLogic AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --bar-bg: #1e1f20;
            --user-bubble: #282a2c;
            --accent: #a8c7fa;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
            --border-color: #444746;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* --- SIDEBAR & HISTORY --- */
        .sidebar {
            width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 16px; box-sizing: border-box;
            transition: transform 0.3s ease; flex-shrink: 0; z-index: 10;
        }
        .sidebar.hidden { transform: translateX(-100%); position: absolute; height: 100%; }

        .new-chat-btn {
            background-color: transparent; color: var(--text-main); border: 1px solid var(--border-color);
            padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 8px;
            cursor: pointer; font-size: 14px; transition: background 0.2s;
        }
        .new-chat-btn:hover { background-color: rgba(255,255,255,0.05); }
        
        .history-list { margin-top: 24px; flex-grow: 1; overflow-y: auto; }
        .history-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-muted);
            font-size: 13px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center;
        }
        .history-item:hover { background-color: rgba(255,255,255,0.05); color: var(--text-main); }
        .history-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; }
        .history-options { opacity: 0; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; }
        .history-item:hover .history-options { opacity: 1; }
        .history-options:hover { color: var(--text-main); }

        /* --- MAIN CONTENT --- */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
        .menu-toggle { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; right: 0; top: 100%; background-color: var(--bar-bg);
            min-width: 180px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5); z-index: 100;
            border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden;
        }
        .dropdown-content button {
            color: var(--text-main); padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 10px;
            background: none; border: none; width: 100%; text-align: left; cursor: pointer; font-size: 14px;
        }
        .dropdown-content button:hover { background-color: rgba(255,255,255,0.1); }
        .show { display: block; }

        /* --- CHAT STREAM & ANIMATIONS --- */
        .chat-container {
            flex-grow: 1; overflow-y: auto; padding: 20px 20px 140px 20px;
            display: flex; flex-direction: column; align-items: center; scroll-behavior: smooth;
        }
        .message-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; margin-bottom: 32px; }
        
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message { align-items: flex-end; animation: slideUpFade 0.3s ease-out forwards; }
        .ai-message { align-items: flex-start; animation: slideUpFade 0.4s ease-out forwards; }

        .bubble { padding: 16px 20px; border-radius: 20px; max-width: 90%; line-height: 1.6; }
        .user-bubble { background-color: var(--user-bubble); border-bottom-right-radius: 4px; color: var(--text-main); }
        .ai-bubble { background-color: transparent; color: var(--text-main); width: 100%; }

        /* --- LOADING ANIMATION --- */
        .loading-text { display: flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 500; }
        .spinner { width: 16px; height: 16px; border: 2px solid transparent; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- SVG ACTION ICONS --- */
        .message-actions { display: flex; gap: 16px; margin-top: 8px; color: var(--text-muted); font-size: 13px; font-weight: 500; }
        .action-link { cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .action-link:hover { color: var(--text-main); }
        .action-link svg { width: 14px; height: 14px; }

        .chat-images { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .chat-img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }

        /* --- INPUT BAR --- */
        .input-wrapper {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 800px; background-color: var(--bar-bg);
            border-radius: 24px; padding: 12px 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; z-index: 50;
        }

        .file-previews { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
        .file-previews:empty { display: none; margin-bottom: 0; }
        
        .preview-card { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .preview-card img { width: 100%; height: 100%; object-fit: cover; }
        .remove-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .remove-btn:hover { background: #ff4444; }

        .chat-bar { display: flex; align-items: flex-end; gap: 12px; }
        textarea { flex-grow: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; resize: none; outline: none; max-height: 150px; min-height: 24px; padding: 10px 0; font-family: inherit; }
        textarea::placeholder { color: #8e918f; }
        
        .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; transition: 0.2s; }
        .icon-btn:hover { background-color: rgba(255,255,255,0.1); }
        .send-btn { background-color: #0b57d0; color: #ffffff; margin-bottom: 2px; }
        .send-btn:hover { background-color: #1b6ef3; }

        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th, td { border: 1px solid var(--border-color); padding: 10px 14px; text-align: left; }
        th { background-color: #282a2c; color: var(--accent); }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" id="new-chat-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        New Chat
    </button>
    <div class="history-list" id="history-list">
        <!-- History items load here -->
    </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
    
    <header class="header">
        <button class="menu-toggle" id="toggle-sidebar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <h2 style="margin:0; font-size: 18px; color: var(--text-muted);">DataLogic AI</h2>
        
        <div class="dropdown">
            <button class="menu-toggle" id="dropdown-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
            </button>
            <div id="dropdown-menu" class="dropdown-content">
                <button onclick="window.print()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download PDF
                </button>
                <button onclick="alert('Share feature coming soon!')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg> Share Chat
                </button>
                <button onclick="deleteCurrentChat()" style="color: #ff4444;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> Delete Chat
                </button>
            </div>
        </div>
    </header>

    <div class="chat-container" id="chat-container"></div>

    <div class="input-wrapper">
        <div id="file-previews" class="file-previews"></div>
        <div class="chat-bar">
            <input type="file" id="file-upload" accept=".csv, .xlsx, image/png, image/jpeg" multiple style="display: none;">
            <button id="add-file-btn" class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg></button>
            <textarea id="prompt-input" rows="1" placeholder="Ask a question or describe how to analyze the files..."></textarea>
            <button id="send-btn" class="icon-btn send-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
        </div>
    </div>
</main>

<script>
    // --- STATE & HISTORY MANAGEMENT ---
    let sessions = JSON.parse(localStorage.getItem('dl_sessions')) || [];
    let currentSessionId = null;

    function saveSession(userText, aiHtml) {
        if (!currentSessionId) {
            currentSessionId = Date.now().toString();
            const title = userText.split(' ').slice(0, 4).join(' ') + '...';
            sessions.unshift({ id: currentSessionId, title: title, messages: [] });
        }
        
        const session = sessions.find(s => s.id === currentSessionId);
        if (session) {
            session.messages.push({ role: 'user', text: userText });
            session.messages.push({ role: 'ai', text: aiHtml });
            localStorage.setItem('dl_sessions', JSON.stringify(sessions));
            renderSidebar();
        }
    }

    function renderSidebar() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        sessions.forEach(session => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <span class="history-title">${session.title}</span>
                <button class="history-options" onclick="deleteSession('${session.id}', event)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            `;
            item.addEventListener('click', () => loadSession(session.id));
            list.appendChild(item);
        });
    }

    function loadSession(id) {
        currentSessionId = id;
        const session = sessions.find(s => s.id === id);
        chatContainer.innerHTML = '';
        if (session) {
            session.messages.forEach(msg => {
                if (msg.role === 'user') appendUserMessage(msg.text, [], false);
                if (msg.role === 'ai') appendAIMessage(msg.text, false, false);
            });
        }
        if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('hidden');
    }

    window.deleteSession = function(id, event) {
        event.stopPropagation();
        sessions = sessions.filter(s => s.id !== id);
        localStorage.setItem('dl_sessions', JSON.stringify(sessions));
        if (currentSessionId === id) startNewChat();
        renderSidebar();
    }

    window.deleteCurrentChat = function() {
        if (currentSessionId) deleteSession(currentSessionId, {stopPropagation: ()=>{}});
        document.getElementById('dropdown-menu').classList.remove('show');
    }

    function startNewChat() {
        currentSessionId = null;
        chatContainer.innerHTML = '';
        allUploadedFiles = []; fileUrls = []; updateDisplay();
    }

    document.getElementById('new-chat-btn').addEventListener('click', startNewChat);
    renderSidebar(); // Load history on startup

    // --- UI TOGGLES ---
    document.getElementById('toggle-sidebar').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('hidden');
    });

    document.getElementById('dropdown-btn').addEventListener('click', (e) => {
        document.getElementById('dropdown-menu').classList.toggle('show'); e.stopPropagation();
    });
    window.onclick = function(event) {
        if (!event.target.closest('.dropdown')) document.getElementById('dropdown-menu').classList.remove('show');
    }

    // --- FILE UPLOADS ---
    const fileInput = document.getElementById('file-upload');
    const addFileBtn = document.getElementById('add-file-btn');
    const filePreviews = document.getElementById('file-previews');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');
    
    let allUploadedFiles = []; let fileUrls = [];

    promptInput.addEventListener('input', function() {
        this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px';
    });

    addFileBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        for (let i = 0; i < e.target.files.length; i++) {
            allUploadedFiles.push(e.target.files[i]);
            fileUrls.push(URL.createObjectURL(e.target.files[i]));
        }
        updateDisplay();
    });

    function updateDisplay() {
        filePreviews.innerHTML = '';
        allUploadedFiles.forEach((file, index) => {
            const card = document.createElement('div'); card.className = 'preview-card';
            card.innerHTML = `<img src="${fileUrls[index]}"><button class="remove-btn" onclick="removeFile(${index})">✕</button>`;
            filePreviews.appendChild(card);
        });
    }

    window.removeFile = function(index) {
        allUploadedFiles.splice(index, 1); fileUrls.splice(index, 1); updateDisplay();
    }

    // --- CHAT RENDERING ---
    function appendUserMessage(text, imgUrls, animate = true) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper user-message';
        if (!animate) wrapper.style.animation = 'none';
        
        let imagesHtml = imgUrls.length > 0 ? `<div class="chat-images">` + imgUrls.map(url => `<img src="${url}" class="chat-img">`).join('') + `</div>` : '';
        const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        const editIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
        const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;

        wrapper.innerHTML = `
            ${imagesHtml}
            <div class="bubble user-bubble">${safeText}</div>
            <div class="message-actions">
                <span class="action-link" onclick="editPrompt('${escape(text)}')">${editIcon} Edit</span>
                <span class="action-link" onclick="navigator.clipboard.writeText('${escape(text)}')">${copyIcon} Copy</span>
            </div>
        `;
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    window.editPrompt = function(escapedText) { promptInput.value = unescape(escapedText); promptInput.focus(); }

    function appendAIMessage(htmlContent, isError = false, animate = true) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper ai-message';
        if (!animate) wrapper.style.animation = 'none';
        
        wrapper.innerHTML = `<div class="bubble ai-bubble" style="${isError ? 'color: #ff4444;' : ''}">${htmlContent}</div>`;
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return wrapper.querySelector('.ai-bubble');
    }

    // --- API & COMPRESSION ---
    async function fileToGenerativePart(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const maxDim = 1024; let width = img.width; let height = img.height;
                    if (width > maxDim || height > maxDim) { if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; } else { width = Math.round((width * maxDim) / height); height = maxDim; } }
                    const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    resolve({ inlineData: { data: canvas.toDataURL('image/jpeg', 0.8).split(',')[1], mimeType: 'image/jpeg' } });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    sendBtn.addEventListener('click', async () => {
        let userText = promptInput.value.trim();
        if (!userText && allUploadedFiles.length === 0) return;
        if (!userText) userText = "Analyze these files and provide a detailed structured breakdown.";

        appendUserMessage(userText, [...fileUrls]);
        
        const filesToSend = [...allUploadedFiles]; 
        allUploadedFiles = []; fileUrls = []; updateDisplay(); 
        promptInput.value = ''; promptInput.style.height = 'auto';

        // Animated Loading State
        const loadingBubble = appendAIMessage(`
            <div class="loading-text">
                <div class="spinner"></div> <span>Analyzing data...</span>
            </div>
        `);

        try {
            const imageParts = await Promise.all(filesToSend.map(fileToGenerativePart));
            let contents = [{ parts: [{ text: userText }] }];
            if (imageParts.length > 0) contents[0].parts.push(...imageParts);

            const response = await fetch("/api/analyze", {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents })
            });

            const data = await response.json();
            
            if (!response.ok) {
                loadingBubble.innerHTML = `API Error: ${data.error || 'Request failed'}`;
                loadingBubble.style.color = '#ff4444';
            } else {
                const parsedMarkdown = marked.parse(data.candidates[0].content.parts[0].text);
                loadingBubble.innerHTML = parsedMarkdown;
                saveSession(userText, parsedMarkdown); // Save to history
            }
        } catch (error) {
            loadingBubble.innerHTML = `Something went wrong. Check console.`;
            loadingBubble.style.color = '#ff4444';
        }
    });

    promptInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
    });
</script>
</body>
</html>
